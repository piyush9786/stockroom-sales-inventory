{% extends 'base.html' %}
{% block title %}Sign in · Sales & Inventory{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<main class="login-wrap">
  <section class="login-card">
    <div class="brand-mark">S</div>
    <p class="eyebrow">SALES & INVENTORY</p>
    <h1>Welcome back.</h1>
    <p class="muted">Sign in to manage your orders and stock.</p>
    <form id="login-form">
      <label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <div id="message" class="message" role="alert" hidden></div>
      <button type="submit" class="primary wide">Sign in</button>
    </form>
    <p class="small muted">Use the local sample accounts created during setup.</p>
  </section>
</main>
{% endblock %}
